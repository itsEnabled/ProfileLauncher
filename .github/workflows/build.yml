name: Build

# Every push to main: build and keep the exe as a downloadable artifact on the run.
# Pushing a tag like v0.5.1: also publish a GitHub Release with the exe attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o dist

      - name: Record SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ProfileLauncher.exe -Algorithm SHA256).Hash
          "$hash  ProfileLauncher.exe" | Set-Content dist\ProfileLauncher.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: ProfileLauncher
          path: |
            dist/ProfileLauncher.exe
            dist/ProfileLauncher.exe.sha256

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ProfileLauncher.exe
            dist/ProfileLauncher.exe.sha256
          generate_release_notes: true
